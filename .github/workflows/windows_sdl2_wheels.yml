name: SDL2 wheels

on:
  pull_request:
    paths:
      - 'win/common.py'
      - 'win/sdl2.py'
      - 'ci/windows_ci.ps1'
      - 'ci/kivy-stable-test-constraints.txt'
      - 'ci/check_wheel_origins.py'
      - 'ci/smoke_test_wheels.py'
      - 'ci/windows_smoke.ps1'
      - 'ci/windows-server-upload.sh'
      - '.github/workflows/windows_sdl2_wheels.yml'
  push:
    branches:
      - master
      - windows_ci
    paths:
      - 'win/common.py'
      - 'win/sdl2.py'
      - 'ci/windows_ci.ps1'
      - 'ci/kivy-stable-test-constraints.txt'
      - 'ci/check_wheel_origins.py'
      - 'ci/smoke_test_wheels.py'
      - 'ci/windows_smoke.ps1'
      - 'ci/windows-server-upload.sh'
      - '.github/workflows/windows_sdl2_wheels.yml'

env:
  SERVER_IP: '159.203.106.198'
  KIVY_BUILD_DIR: kivy_build
  KIVY_BUILD_CACHE: kivy_build_cache
  PACKAGE_TARGET: sdl2
  PYTHONPATH: .

jobs:
  prepare_cache:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ['x64']
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Cache deps
        id: cache
        uses: actions/cache@v6
        with:
          path: kivy_build_cache
          key: cache-packages-sdl2-${{ matrix.arch }}-${{ hashFiles('win/sdl2.py') }}
      - name: Prepare Environment
        run: |
          . .\ci\windows_ci.ps1
          Prepre-env
      - name: Download Dependencies
        run: |
          . .\ci\windows_ci.ps1
          Download-Packages

  windows_wheels:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: prepare_cache
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14' ]
        arch: ['x64']
        include:
          - python: '3.9'
            package-test: kivy-stable
          - python: '3.10'
            package-test: kivy-stable
          - python: '3.11'
            package-test: kivy-stable
          - python: '3.12'
            package-test: kivy-stable
          - python: '3.13'
            package-test: kivy-stable
          # No Kivy release supports 3.14 yet; see win/README.md.
          - python: '3.14'
            package-test: smoke
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.arch }}
    - name: Cache deps
      uses: actions/cache@v6
      with:
        path: kivy_build_cache
        key: cache-packages-sdl2-${{ matrix.arch }}-${{ hashFiles('win/sdl2.py') }}
    - name: Prepare Environment
      run: |
        . .\ci\windows_ci.ps1
        Prepre-env
    - name: Build package
      run: |
        . .\ci\windows_ci.ps1
        Create-Packages
    - name: Upload wheels as artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: sdl2_wheels-${{ matrix.python }}-${{ matrix.arch }}
        path: dist
    - name: Install MSYS2
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      run: choco install msys2
    - name: Upload wheels to server
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      env:
        UBUNTU_UPLOAD_KEY: ${{ secrets.UBUNTU_UPLOAD_KEY }}
        UPLOAD_IGNORE_EXISTING: 1
        MSYSTEM: MINGW64
        CHERE_INVOKING: 1
      run: |
        . .\ci\windows_ci.ps1
        Upload-windows-wheels-to-server -ip "$env:SERVER_IP"
    - name: Publish to PyPI
      if: contains(github.event.head_commit.message, '[publish sdl2 win]')
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.pypi_password }}
      run: |
        twine upload --non-interactive --skip-existing dist/*
    - name: Test package
      if: matrix.package-test == 'kivy-stable'
      run: |
        . .\ci\windows_ci.ps1
        Test-kivy -KivyTestTarget stable
    - name: Smoke test package
      if: matrix.package-test == 'smoke'
      run: |
        . .\ci\windows_smoke.ps1
        Test-wheel-smoke
