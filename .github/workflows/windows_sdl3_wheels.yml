name: SDL3 wheels

on:
  pull_request:
    paths:
      - 'win/common.py'
      - 'win/sdl3.py'
      - 'win/build_sdl3.ps1'
      - 'ci/windows_ci.ps1'
      - 'ci/check_wheel_origins.py'
      - 'ci/smoke_test_wheels.py'
      - 'ci/windows_smoke.ps1'
      - 'ci/windows-server-upload.sh'
      - '.github/workflows/windows_sdl3_wheels.yml'
  push:
    branches:
      - master
      - windows_ci
    paths:
      - 'win/common.py'
      - 'win/sdl3.py'
      - 'win/build_sdl3.ps1'
      - 'ci/windows_ci.ps1'
      - 'ci/check_wheel_origins.py'
      - 'ci/smoke_test_wheels.py'
      - 'ci/windows_smoke.ps1'
      - 'ci/windows-server-upload.sh'
      - '.github/workflows/windows_sdl3_wheels.yml'

env:
  SERVER_IP: '159.203.106.198'
  KIVY_BUILD_DIR: kivy_build
  KIVY_BUILD_CACHE: kivy_build_cache
  PACKAGE_TARGET: sdl3
  PYTHONPATH: .

jobs:
  prepare_sdl3_build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ['x64']
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Build SDL3 for arch ${{ matrix.arch }}
        run: |
          ./win/build_sdl3.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdl3_build_${{ matrix.arch }}
          path: kivy-dependencies/dist

  windows_wheels:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: prepare_sdl3_build
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]
        arch: ['x64']
        include:
          - python: '3.11'
            package-test: kivy-development
          - python: '3.12'
            package-test: kivy-development
          - python: '3.13'
            package-test: kivy-development
          - python: '3.14'
            package-test: kivy-development
          # No Kivy release or master supports 3.15 yet; see win/README.md.
          - python: '3.15'
            package-test: smoke
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.arch }}
    - name: Prepare Environment
      run: |
        . .\ci\windows_ci.ps1
        Prepre-env
    - uses: actions/download-artifact@v8.0.2
      with:
        name: sdl3_build_${{ matrix.arch }}
        path: kivy_build
    - name: Build package
      run: |
        . .\ci\windows_ci.ps1
        Create-Packages
    - name: Upload wheels as artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: sdl3_wheel_${{ matrix.arch }}_${{ matrix.python }}
        path: dist
    - name: Test package
      if: matrix.package-test == 'kivy-development'
      run: |
        . .\ci\windows_ci.ps1
        Test-kivy -KivyTestTarget development
    - name: Smoke test package
      if: matrix.package-test == 'smoke'
      run: |
        . .\ci\windows_smoke.ps1
        Test-wheel-smoke

  publish:
    # Runs only after every build/test row passes, and uploads those rows' wheels.
    if: contains(github.event.head_commit.message, '[publish sdl3 win]')
    needs: windows_wheels
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Download tested wheels
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: sdl3_wheel_*
        path: dist
        merge-multiple: true
    - name: List wheels
      run: dir dist
    - name: Install MSYS2
      run: choco install msys2
    - name: Upload wheels to server
      env:
        UBUNTU_UPLOAD_KEY: ${{ secrets.UBUNTU_UPLOAD_KEY }}
        UPLOAD_IGNORE_EXISTING: 1
        MSYSTEM: MINGW64
        CHERE_INVOKING: 1
      run: |
        . .\ci\windows_ci.ps1
        Upload-windows-wheels-to-server -ip "$env:SERVER_IP"
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: "__token__"
        TWINE_PASSWORD: ${{ secrets.pypi_password }}
      run: |
        python -m pip install twine
        twine upload --non-interactive --skip-existing dist/*
